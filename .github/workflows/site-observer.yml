name: Gip Site Observer

on:
  workflow_dispatch:

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run capture
      - uses: actions/upload-artifact@v4
        with:
          name: gip-site-packs
          path: site-packs/

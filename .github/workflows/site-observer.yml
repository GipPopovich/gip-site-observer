name: Gip Site Observer

on:
  push:
    branches: [main]
    paths:
      - 'capture.mjs'
      - 'sites.json'
      - 'package.json'
      - '.github/workflows/site-observer.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gip-site-observer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture configured sites
        shell: bash
        run: |
          mkdir -p site-packs
          set -o pipefail
          npm run capture 2>&1 | tee site-packs/crawl.log
      - name: Upload verified site packs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gip-site-packs
          path: site-packs/
          if-no-files-found: error
          retention-days: 30
